name: Test

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review

jobs:
  test-pydantic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6
        id: cache
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ runner.os }}-python-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}-test-pydantic
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pip install --group test ".[pydantic]"
      - run: mkdir coverage
      - name: Test
        run: bash scripts/test.sh
        env:
          COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version }}-pydantic
          CONTEXT: ${{ runner.os }}-py${{ matrix.python-version }}-pydantic
      - name: Store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: .coverage.${{ runner.os }}-py${{ matrix.python-version }}-pydantic
          path: coverage
          if-no-files-found: error
          include-hidden-files: true

  test-pydantic-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pydantic-version: ["2.12.5", "2.13.5"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install --group test ".[pydantic,msgspec]" "pydantic==${{ matrix.pydantic-version }}"
      - run: mkdir coverage
      - name: Test supported Pydantic versions
        run: coverage run -m pytest
        env:
          COVERAGE_FILE: coverage/.coverage.pydantic-${{ matrix.pydantic-version }}
          CONTEXT: pydantic-${{ matrix.pydantic-version }}
      - uses: actions/upload-artifact@v7
        with:
          name: .coverage.pydantic-${{ matrix.pydantic-version }}
          path: coverage
          if-no-files-found: error
          include-hidden-files: true

  test-msgspec:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6
        id: cache
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ runner.os }}-python-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}-test-msgspec
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pip install --group test ".[msgspec]"
      - run: mkdir coverage
      - name: Test
        run: bash scripts/test.sh
        env:
          COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version }}-msgspec
          CONTEXT: ${{ runner.os }}-py${{ matrix.python-version }}-msgspec
      - name: Store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: .coverage.${{ runner.os }}-py${{ matrix.python-version }}-msgspec
          path: coverage
          if-no-files-found: error
          include-hidden-files: true

  test-no-serializer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.15"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6
        id: cache
        with:
          path: ${{ env.pythonLocation }}
          key: no-pydantic-python-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pip install --group test .
      - run: mkdir coverage
      - name: Test
        run: bash scripts/test.sh
        env:
          COVERAGE_FILE: coverage/.coverage.no-serializer-${{ matrix.python-version }}
          CONTEXT: no-serializer-${{ matrix.python-version }}
      - name: Store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: .coverage.no-serializer-${{ matrix.python-version }}
          path: coverage
          if-no-files-found: error
          include-hidden-files: true

  coverage-combine:
    needs: [test-pydantic,test-pydantic-compat,test-msgspec,test-no-serializer]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Get coverage files
        uses: actions/download-artifact@v8
        with:
          pattern: .coverage*
          path: coverage
          merge-multiple: true

      - run: pip install coverage[toml]

      - run: ls -la coverage
      - run: coverage combine coverage
      - run: coverage report --fail-under=100
      - run: coverage html --show-contexts --title "FastDepends coverage for ${{ github.sha }}"
        if: always()

      - name: Store coverage html
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov
          include-hidden-files: true

  # https://github.com/marketplace/actions/alls-green#why
  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - coverage-combine

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
